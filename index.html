<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Runner 2050 - Stage 5 JS Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #00f0ff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 10px; font-size: 26px; }
        #game-container {
            position: relative;
            border: 3px solid #00f0ff;
            border-radius: 6px;
        }
        canvas { display: block; background: #1e293b; }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.8);
            padding: 8px 15px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }
        .controls-hint {
            margin-top: 10px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <h1>CYBER RUNNER 2050</h1>

    <div id="game-container">
        <div id="hud">
            <div>LEVEL: <span id="lvl-display" style="color: #facc15;">1</span></div>
            <div>SCORE: <span id="score-display" style="color: #4ade80;">0</span></div>
            <div>LIVES: <span id="lives-display" style="color: #f87171;">3</span></div>
        </div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <div class="controls-hint">
        Use WASD or Arrow Keys to move. Collect all Orbs to open the Portal!
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let currentLevel = 1;
let score = 0;
let lives = 3;
let keys = {};

// Player Object
let player = { x: 50, y: 50, size: 24, speed: 4, color: '#00f0ff' };

// Level Elements
let orbs = [];
let hazards = [];
let lasers = [];
let portal = { x: 720, y: 420, size: 40, active: false };

function initLevel(lvl) {
    currentLevel = lvl;
    player.x = 50;
    player.y = 50;
    portal.active = false;

    document.getElementById('lvl-display').innerText = lvl;

    if (lvl === 1) {
        orbs = [
            {x: 200, y: 150, r: 10}, {x: 400, y: 100, r: 10},
            {x: 600, y: 250, r: 10}, {x: 350, y: 380, r: 10}, {x: 500, y: 420, r: 10}
        ];
        hazards = [
            {x: 250, y: 200, w: 30, h: 30}, {x: 450, y: 180, w: 30, h: 30},
            {x: 300, y: 320, w: 30, h: 30}, {x: 550, y: 300, w: 30, h: 30}
        ];
        lasers = [];
    } else if (lvl === 2) {
        orbs = [
            {x: 180, y: 120, r: 10}, {x: 380, y: 80, r: 10}, {x: 580, y: 150, r: 10},
            {x: 250, y: 300, r: 10}, {x: 450, y: 400, r: 10}
        ];
        hazards = [{x: 380, y: 220, w: 40, h: 40}];
        lasers = [
            {x: 200, y: 160, w: 120, h: 12, dx: 3},
            {x: 500, y: 280, w: 140, h: 12, dx: -3}
        ];
    } else if (lvl === 3) {
        orbs = [
            {x: 150, y: 150, r: 10}, {x: 300, y: 100, r: 10}, {x: 450, y: 150, r: 10},
            {x: 600, y: 100, r: 10}, {x: 350, y: 350, r: 10}
        ];
        hazards = [
            {x: 400, y: 250, w: 50, h: 50},
            {x: 200, y: 300, w: 40, h: 40}
        ];
        lasers = [
            {x: 150, y: 200, w: 160, h: 14, dx: 4},
            {x: 450, y: 320, w: 160, h: 14, dx: -4}
        ];
    }
    updateHUD();
}

function resetLevel() {
    if (lives <= 0) {
        alert("Game Over! Restarting from Level 1.");
        score = 0;
        lives = 3;
        initLevel(1);
    } else {
        initLevel(currentLevel);
    }
}

function updateHUD() {
    document.getElementById('score-display').innerText = score;
    document.getElementById('lives-display').innerText = lives;
}

// Input Event Handling
window.addEventListener('keydown', e => {
    let key = e.key.toLowerCase();
    keys[key] = true;
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(key)) {
        e.preventDefault();
    }
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// Collision Helper
function checkCollision(r1, r2) {
    return r1.x < r2.x + r2.w && r1.x + r1.size > r2.x &&
           r1.y < r2.y + r2.h && r1.y + r1.size > r2.y;
}

function update() {
    // Player Movement
    if ((keys['w'] || keys['arrowup']) && player.y > 0) player.y -= player.speed;
    if ((keys['s'] || keys['arrowdown']) && player.y < canvas.height - player.size) player.y += player.speed;
    if ((keys['a'] || keys['arrowleft']) && player.x > 0) player.x -= player.speed;
    if ((keys['d'] || keys['arrowright']) && player.x < canvas.width - player.size) player.x += player.speed;

    // Collect Orbs
    orbs = orbs.filter(orb => {
        let hit = Math.hypot(player.x + 12 - orb.x, player.y + 12 - orb.y) < player.size/2 + orb.r;
        if (hit) {
            score += 10;
            updateHUD();
            return false;
        }
        return true;
    });

    if (orbs.length === 0) portal.active = true;

    // Check Spikes/Hazards
    for (let h of hazards) {
        if (checkCollision(player, h)) {
            lives--;
            resetLevel();
            return;
        }
    }

    // Check Moving Lasers
    for (let l of lasers) {
        if (checkCollision(player, l)) {
            lives--;
            resetLevel();
            return;
        }
    }

    // Update Moving Lasers
    lasers.forEach(l => {
        l.x += l.dx;
        if (l.x <= 50 || l.x + l.w >= 750) l.dx *= -1;
    });

    // Check Exit Portal
    if (portal.active && checkCollision(player, {x: portal.x, y: portal.y, w: portal.size, h: portal.size})) {
        if (currentLevel < 3) {
            initLevel(currentLevel + 1);
        } else {
            alert("You beat the game!");
            currentLevel = 1; score = 0; lives = 3; initLevel(1);
        }
    }
}

function draw() {
    // Background Color per Level
    ctx.fillStyle = currentLevel === 1 ? '#0f172a' : (currentLevel === 2 ? '#1e1b4b' : '#3f0713');
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw Orbs
    ctx.fillStyle = '#facc15';
    orbs.forEach(o => {
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.r, 0, Math.PI*2);
        ctx.fill();
    });

    // Draw Hazards
    ctx.fillStyle = '#ef4444';
    hazards.forEach(h => ctx.fillRect(h.x, h.y, h.w, h.h));

    // Draw Lasers
    ctx.fillStyle = '#d946ef';
    lasers.forEach(l => ctx.fillRect(l.x, l.y, l.w, l.h));

    // Draw Exit Portal
    if (portal.active) {
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(portal.x, portal.y, portal.size, portal.size);
    }

    // Draw Player
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.size, player.size);
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

initLevel(1);
gameLoop();
</script>
</body>
</html>
